<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas 文字粒子动画 - 邓嘉毅 24001010907</title>
<meta name="author" content="邓嘉毅 24001010907">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { text-align: center; padding: 28px 20px 18px; border-bottom: 3px solid #22d3ee; background: linear-gradient(135deg, #1e293b, #0f172a); }
  header h1 { font-size: 26px; background: linear-gradient(90deg, #22d3ee, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
  .author { display: inline-block; margin-top: 10px; padding: 5px 16px; background: #22d3ee; color: #0f172a; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .stage { display: flex; justify-content: center; padding: 20px; }
  canvas { background: #020617; border-radius: 14px; border: 1px solid #334155; max-width: 96vw; }
  .tips { text-align: center; color: #64748b; font-size: 13px; padding-bottom: 30px; }
</style>
</head>
<body>

<header>
  <h1>🎆 Canvas 文字粒子动画</h1>
  <p>使用 Canvas 2D + requestAnimationFrame 实现粒子汇聚成文字</p>
  <span class="author">邓嘉毅 · 24001010907</span>
</header>

<div class="stage"><canvas id="cv" width="900" height="380"></canvas></div>
<p class="tips">移动鼠标可以吹散粒子，松开后粒子会重新回到文字上 ✨</p>

<script>
  const TEXT = '邓嘉毅';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  // 1. 离屏 canvas 绘制文字，采样像素得到粒子目标点
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.font = 'bold 200px "Microsoft YaHei"';
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(TEXT, W / 2, H / 2);
  const imgData = octx.getImageData(0, 0, W, H).data;

  const targets = [];
  const gap = 5;
  for (let y = 0; y < H; y += gap) {
    for (let x = 0; x < W; x += gap) {
      if (imgData[(y * W + x) * 4 + 3] > 128) targets.push({ x, y });
    }
  }

  // 2. 粒子
  const COLORS = ['#22d3ee', '#a78bfa', '#f472b6', '#fbbf24', '#34d399'];
  const particles = targets.map(t => ({
    x: Math.random() * W,
    y: Math.random() * H,
    tx: t.x, ty: t.y,
    vx: 0, vy: 0,
    r: 1.6 + Math.random() * 1.4,
    color: colors[Math.floor(Math.random() * colors.length)]
  }));

  const mouse = { x: -9999, y: -9999 };
  cv.addEventListener('mousemove', e => {
    const rect = cv.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) * (W / rect.width);
    mouse.y = (e.clientY - rect.top) * (H / rect.height);
  });
  cv.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  // 3. 动画循环
  function tick() {
    ctx.fillStyle = 'rgba(2,6,23,0.25)';
    ctx.fillRect(0, 0, W, H);
    for (const p of particles) {
      // 回到目标点的弹力
      p.vx += (p.tx - p.x) * 0.02;
      p.vy += (p.ty - p.y) * 0.02;
      // 鼠标排斥
      const dx = p.x - mouse.x, dy = p.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 8100) {
        const d = Math.sqrt(d2) || 1;
        const f = (90 - d) / 90 * 2.4;
        p.vx += dx / d * f;
        p.vy += dy / d * f;
      }
      p.vx *= 0.86; p.vy *= 0.86;
      p.x += p.vx; p.y += p.vy;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>

</body>
</html>
