<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球数据可视化大屏 - 邓嘉毅 24001010907</title>
<meta name="author" content="邓嘉毅 24001010907">
<script src="./cdn/echarts.min.js"></script>
<script src="./cdn/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #050b1a; color: #e2e8f0; overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(167,139,250,0.15), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(34,211,238,0.12), transparent 45%);
  }
  header {
    text-align: center; padding: 16px 20px;
    background: linear-gradient(90deg, transparent, rgba(34,211,238,0.25), transparent);
    border-bottom: 1px solid rgba(34,211,238,0.3);
    position: relative;
  }
  header h1 {
    font-size: 28px; letter-spacing: 6px;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(34,211,238,0.3);
  }
  header .time { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #22d3ee; font-family: Consolas, monospace; }
  header .author { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #a78bfa; }

  .dash {
    display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 16px;
    padding: 16px; height: calc(100vh - 70px);
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(34, 211, 238, 0.25);
    border-radius: 10px; padding: 14px;
    box-shadow: 0 0 20px rgba(34, 211, 238, 0.05) inset;
    position: relative;
  }
  .card::before {
    content: ""; position: absolute; top: -1px; left: 12px; right: 12px; height: 2px;
    background: linear-gradient(90deg, transparent, #22d3ee, transparent);
  }
  .card h3 {
    font-size: 14px; color: #22d3ee; margin-bottom: 10px; letter-spacing: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .card h3::before { content: ""; width: 4px; height: 14px; background: #22d3ee; border-radius: 2px; }

  .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-item {
    background: rgba(34, 211, 238, 0.06); border: 1px solid rgba(34, 211, 238, 0.15);
    border-radius: 8px; padding: 12px; text-align: center;
  }
  .kpi-item .num { font-size: 24px; color: #fbbf24; font-weight: bold; font-family: Consolas, monospace; }
  .kpi-item .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }

  .chart { width: 100%; height: 220px; }
  .chart.tall { height: 260px; }

  .globe-wrap { flex: 1; position: relative; min-height: 320px; }
  #globe { width: 100%; height: 100%; display: block; }
  .globe-legend {
    position: absolute; top: 14px; left: 14px; font-size: 12px; color: #94a3b8;
    background: rgba(2,6,23,0.6); padding: 8px 12px; border-radius: 6px;
  }
  .globe-legend b { color: #22d3ee; }

  .rank-list { list-style: none; }
  .rank-list li {
    display: flex; align-items: center; gap: 10px; padding: 7px 4px;
    border-bottom: 1px dashed rgba(148,163,184,0.15); font-size: 13px;
  }
  .rank-list li:last-child { border-bottom: none; }
  .rank-list .rk {
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: bold; background: #334155; color: #cbd5e1; flex-shrink: 0;
  }
  .rank-list li:nth-child(1) .rk { background: #fbbf24; color: #0f172a; }
  .rank-list li:nth-child(2) .rk { background: #94a3b8; color: #0f172a; }
  .rank-list li:nth-child(3) .rk { background: #d97706; color: #0f172a; }
  .rank-list .name { flex: 1; color: #e2e8f0; }
  .rank-list .val { color: #22d3ee; font-family: Consolas, monospace; }

  @media (max-width: 1100px) { .dash { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>

<header>
  <span class="author">邓嘉毅 · 24001010907</span>
  <h1>🌍 全球数据可视化大屏</h1>
  <span class="time" id="clock">--:--:--</span>
</header>

<div class="dash">

  <!-- 左列 -->
  <div class="col">
    <div class="card">
      <h3>核心指标</h3>
      <div class="kpi">
        <div class="kpi-item"><div class="num" id="kpi1">128,430</div><div class="label">总访问量</div></div>
        <div class="kpi-item"><div class="num" id="kpi2">96.8%</div><div class="label">服务可用率</div></div>
        <div class="kpi-item"><div class="num" id="kpi3">3,281</div><div class="label">当前在线</div></div>
        <div class="kpi-item"><div class="num" id="kpi4">0.42s</div><div class="label">平均响应</div></div>
      </div>
    </div>
    <div class="card">
      <h3>近 7 日访问趋势</h3>
      <div id="lineChart" class="chart tall"></div>
    </div>
    <div class="card">
      <h3>地区访问 TOP 5</h3>
      <ul class="rank-list">
        <li><span class="rk">1</span><span class="name">北京</span><span class="val">32,104</span></li>
        <li><span class="rk">2</span><span class="name">上海</span><span class="val">28,560</span></li>
        <li><span class="rk">3</span><span class="name">深圳</span><span class="val">21,877</span></li>
        <li><span class="rk">4</span><span class="name">广州</span><span class="val">19,032</span></li>
        <li><span class="rk">5</span><span class="name">杭州</span><span class="val">15,668</span></li>
      </ul>
    </div>
  </div>

  <!-- 中列 -->
  <div class="col">
    <div class="card globe-wrap">
      <h3>全球地理分布</h3>
      <canvas id="globe"></canvas>
      <div class="globe-legend">
        <div>📍 <b>在线节点</b>：86 个</div>
        <div>🌐 <b>覆盖国家</b>：42 个</div>
        <div>🔴 <b>热点区域</b>：东亚 / 欧美</div>
      </div>
    </div>
    <div class="card">
      <h3>全球区域访问占比</h3>
      <div id="barChart" class="chart"></div>
    </div>
  </div>

  <!-- 右列 -->
  <div class="col">
    <div class="card">
      <h3>流量来源构成</h3>
      <div id="pieChart" class="chart tall"></div>
    </div>
    <div class="card">
      <h3>设备类型分布</h3>
      <div id="barChart2" class="chart tall"></div>
    </div>
  </div>

</div>

<script>
// 时钟
function tickClock() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('zh-CN', { hour12: false });
}
setInterval(tickClock, 1000); tickClock();

// 动态 KPI
setInterval(() => {
  document.getElementById('kpi3').textContent = (3000 + Math.floor(Math.random() * 600)).toLocaleString();
}, 2000);

// ============ 中列上方：three.js 3D 地球 ============
(function() {
  const canvas = document.getElementById('globe');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(0, 0, 14);

  // 地球主体
  const earthGeo = new THREE.SphereGeometry(4, 64, 64);
  const earthMat = new THREE.MeshPhongMaterial({
    color: 0x0c4a6e, emissive: 0x082f49, shininess: 15, transparent: true, opacity: 0.9
  });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  scene.add(earth);

  // 经纬线
  const lineMat = new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.35 });
  for (let i = 0; i <= 12; i++) {
    const geo = new THREE.RingGeometry(4.01, 4.01 + 0.02, 64);
    const line = new THREE.Line(geo, lineMat);
    line.rotation.x = Math.PI / 2;
    line.position.y = Math.cos((i / 12) * Math.PI) * 4;
    const scale = Math.sin((i / 12) * Math.PI);
    line.scale.set(scale, scale, 1);
    scene.add(line);
  }
  for (let i = 0; i < 16; i++) {
    const geo = new THREE.RingGeometry(4.01, 4.02, 64);
    const line = new THREE.Line(geo, lineMat);
    line.rotation.y = (i / 16) * Math.PI;
    scene.add(line);
  }

  // 大气层光晕
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(4.3, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.12, side: THREE.BackSide })
  );
  scene.add(glow);

  // 随机大陆点（模拟地理数据）
  const dotGeo = new THREE.SphereGeometry(0.04, 6, 6);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xf472b6 });
  const hotspotMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
  for (let i = 0; i < 120; i++) {
    const lat = (Math.random() - 0.5) * Math.PI;
    const lon = Math.random() * Math.PI * 2;
    const r = 4.03;
    const dot = new THREE.Mesh(dotGeo, Math.random() > 0.8 ? hotspotMat : dotMat);
    dot.position.set(r * Math.cos(lat) * Math.cos(lon), r * Math.sin(lat), r * Math.cos(lat) * Math.sin(lon));
    scene.add(dot);
  }

  // 光源
  scene.add(new THREE.AmbientLight(0x404040, 1.5));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(5, 3, 5); scene.add(dl);

  // 星星背景
  const starsGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(1000 * 3);
  for (let i = 0; i < 1000; i++) {
    sp[i*3] = (Math.random() - 0.5) * 200;
    sp[i*3+1] = (Math.random() - 0.5) * 200;
    sp[i*3+2] = (Math.random() - 0.5) * 200;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 })));

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  resize(); window.addEventListener('resize', resize);

  function tick() {
    earth.rotation.y += 0.002;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();

// ============ ECharts 图表 ============
const commonAxis = {
  axisLine: { lineStyle: { color: '#334155' } },
  axisLabel: { color: '#94a3b8' },
  splitLine: { lineStyle: { color: 'rgba(148,163,184,0.1)' } }
};

echarts.init(document.getElementById('lineChart'), 'dark').setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'axis' },
  xAxis: { type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日'], ...commonAxis },
  yAxis: { type: 'value', ...commonAxis },
  series: [{
    type: 'line', smooth: true, symbol: 'circle', symbolSize: 8,
    data: [820, 932, 901, 934, 1290, 1330, 1320],
    lineStyle: { color: '#22d3ee', width: 3 },
    itemStyle: { color: '#22d3ee' },
    areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[
      { offset: 0, color: 'rgba(34,211,238,0.5)' }, { offset: 1, color: 'rgba(34,211,238,0)' }]) }
  }]
});

echarts.init(document.getElementById('barChart'), 'dark').setOption({
  backgroundColor: 'transparent',
  tooltip: {},
  xAxis: { type: 'category', data: ['亚洲','欧洲','北美','南美','非洲','大洋洲'], ...commonAxis },
  yAxis: { type: 'value', ...commonAxis },
  series: [{ type: 'bar', data: [5200, 4100, 3800, 1900, 1200, 900],
    itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[
      { offset: 0, color: '#a78bfa' }, { offset: 1, color: '#22d3ee' }]), borderRadius: [6,6,0,0] } }]
});

echarts.init(document.getElementById('pieChart'), 'dark').setOption({
  backgroundColor: 'transparent',
  tooltip: { trigger: 'item', formatter: '{b}: {d}%' },
  legend: { bottom: 0, textStyle: { color: '#94a3b8' } },
  series: [{
    type: 'pie', radius: ['40%', '65%'], center: ['50%', '45%'],
    label: { color: '#e2e8f0', formatter: '{b}\n{d}%' },
    data: [
      { value: 45, name: '搜索引擎' },
      { value: 25, name: '直接访问' },
      { value: 15, name: '社交媒体' },
      { value: 10, name: '外部链接' },
      { value: 5,  name: '其他' }
    ]
  }]
});

echarts.init(document.getElementById('barChart2'), 'dark').setOption({
  backgroundColor: 'transparent',
  tooltip: {},
  xAxis: { type: 'category', data: ['PC','手机','平板','其他'], ...commonAxis },
  yAxis: { type: 'value', ...commonAxis },
  series: [{ type: 'bar', data: [62, 28, 7, 3],
    itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0,[
      { offset: 0, color: '#f472b6' }, { offset: 1, color: '#fbbf24' }]), borderRadius: [0,6,6,0] } }]
});

window.addEventListener('resize', () => {
  document.querySelectorAll('.chart').forEach(el => {
    const inst = echarts.getInstanceByDom(el);
    if (inst) inst.resize();
  });
});
</script>

</body>
</html>
