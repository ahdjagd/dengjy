<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUV 导购分类 - 邓嘉毅 24001010907</title>
<meta name="author" content="邓嘉毅 24001010907">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap {
    max-width: 600px;
    margin: 0 auto;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: #222;
    margin-bottom: 16px;
    text-align: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  /* Tab 栏 */
  .tabs {
    display: flex;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    min-width: 70px;
    padding: 14px 10px;
    text-align: center;
    font-size: 15px;
    color: #666;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { color: #333; }
  .tab.active {
    color: #e53935;
    border-bottom-color: #e53935;
    background: #fff;
    font-weight: 600;
  }
  /* 图片区 */
  .tab-panel {
    display: none;
    padding: 16px;
  }
  .tab-panel.active { display: block; }
  .tab-panel img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    border: 1px solid #eee;
  }
  .tab-panel .caption {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
    text-align: center;
  }
  .author {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #999;
  }
  .author span {
    display: inline-block;
    padding: 5px 14px;
    background: #e53935;
    color: #fff;
    border-radius: 20px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-title">SUV 导购分类</div>

  <div class="card">
    <!-- 分类 Tab -->
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="1">导购</div>
      <div class="tab" data-tab="2">3-9万</div>
      <div class="tab" data-tab="3">9-17万</div>
      <div class="tab" data-tab="4">17-42万</div>
      <div class="tab" data-tab="5">SUV</div>
    </div>

    <!-- Tab 内容 -->
    <div class="tab-panel active" data-panel="1">
      <img src="images/suv-5.jpg" alt="导购">
      <div class="caption">导购 · 全部车型资讯</div>
    </div>
    <div class="tab-panel" data-panel="2">
      <img src="images/suv-1.jpg" alt="3-9万">
      <div class="caption">3-9万 · 经济型 SUV</div>
    </div>
    <div class="tab-panel" data-panel="3">
      <img src="images/suv-2.jpg" alt="9-17万">
      <div class="caption">9-17万 · 中端 SUV</div>
    </div>
    <div class="tab-panel" data-panel="4">
      <img src="images/suv-3.jpg" alt="17-42万">
      <div class="caption">17-42万 · 高端 SUV</div>
    </div>
    <div class="tab-panel" data-panel="5">
      <img src="images/suv-4.jpg" alt="SUV">
      <div class="caption">SUV · 专题推荐</div>
    </div>
  </div>

  <div class="author">
    <span>邓嘉毅 · 24001010907</span>
  </div>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const n = tab.dataset.tab;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      panels.forEach(p => p.classList.toggle('active', p.dataset.panel === n));
    });
  });
</script>

</body>
</html>
