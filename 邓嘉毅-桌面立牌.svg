<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="300mm" height="200mm"
     viewBox="0 0 300 200"
     font-family="Arial, sans-serif">

  <!-- ===== 参考图层（非切割） ===== -->
  <!-- 材料边界 300 x 200 mm，虚线仅作排版参考，不切割 -->
  <rect x="0" y="0" width="300" height="200"
        fill="#ffffff" stroke="#bbbbbb" stroke-width="0.2" stroke-dasharray="3,2"/>

  <!-- 标题栏（非切割，灰色文字） -->
  <text x="10" y="15" font-size="5" fill="#666666">1—数字模型与加工图纸</text>
  <text x="10" y="22" font-size="4" fill="#888888">作品：桌面立牌　作者：邓嘉毅　材料：3mm 亚克力/木板　尺寸：300×200mm</text>
  <text x="290" y="15" font-size="4" fill="#888888" text-anchor="end">激光切割图</text>

  <!-- 零件标注（非切割） -->
  <text x="150" y="15" font-size="4" fill="#e53935" text-anchor="middle">A 底座</text>
  <text x="150" y="115" font-size="4" fill="#e53935" text-anchor="middle">B 立板</text>

  <!-- ===== 黑色「切割」图层 ===== -->
  <g id="cutting-layer" stroke="#000000" stroke-width="0.1" fill="none" stroke-linejoin="miter">

    <!-- ============ 零件 A：底座 ============ -->
    <!-- 外轮廓 200 x 65 mm，闭合 -->
    <path d="M 50,25
             L 250,25
             L 250,90
             L 50,90 Z"/>

    <!-- 插槽 1（供 B 立板左侧凸榫插入）：25 x 3 mm，闭合 -->
    <path d="M 85,25
             L 85,28
             L 110,28
             L 110,25 Z"/>

    <!-- 插槽 2（供 B 立板右侧凸榫插入）：25 x 3 mm，闭合 -->
    <path d="M 140,25
             L 140,28
             L 165,28
             L 165,25 Z"/>

    <!-- ============ 零件 B：立板（带底部凸榫） ============ -->
    <!-- 外轮廓 200 x 80 mm，底部带两个凸榫，单条闭合路径 -->
    <path d="M 50,100
             L 250,100
             L 250,180
             L 165,180
             L 165,190
             L 140,190
             L 140,180
             L 110,180
             L 110,190
             L 85,190
             L 85,180
             L 50,180 Z"/>

  </g>

  <!-- ===== 尺寸标注（非切割，蓝色细虚线，便于读图） ===== -->
  <g stroke="#1e88e5" stroke-width="0.15" fill="none" stroke-dasharray="1,1.5">
    <!-- 底座宽度 200 -->
    <line x1="50" y1="20" x2="250" y2="20"/>
    <line x1="50" y1="18" x2="50" y2="22"/>
    <line x1="250" y1="18" x2="250" y2="22"/>
    <text x="150" y="18" font-size="3.5" fill="#1e88e5" text-anchor="middle" stroke="none">200</text>
    <!-- 底座高度 65 -->
    <line x1="45" y1="25" x2="45" y2="90"/>
    <line x1="43" y1="25" x2="47" y2="25"/>
    <line x1="43" y1="90" x2="47" y2="90"/>
    <text x="41" y="60" font-size="3.5" fill="#1e88e5" text-anchor="end" stroke="none">65</text>
    <!-- 立板宽度 200 -->
    <line x1="50" y1="95" x2="250" y2="95"/>
    <line x1="50" y1="93" x2="50" y2="97"/>
    <line x1="250" y1="93" x2="250" y2="97"/>
    <text x="150" y="93" font-size="3.5" fill="#1e88e5" text-anchor="middle" stroke="none">200</text>
    <!-- 立板高度 80 -->
    <line x1="255" y1="100" x2="255" y2="180"/>
    <line x1="253" y1="100" x2="257" y2="100"/>
    <line x1="253" y1="180" x2="257" y2="180"/>
    <text x="259" y="143" font-size="3.5" fill="#1e88e5" stroke="none">80</text>
    <!-- 插槽宽度 25 -->
    <line x1="85" y1="35" x2="110" y2="35"/>
    <text x="97.5" y="33" font-size="3" fill="#1e88e5" text-anchor="middle" stroke="none">25</text>
    <!-- 凸榫长度 10 -->
    <line x1="78" y1="180" x2="78" y2="190"/>
    <text x="76" y="186" font-size="3" fill="#1e88e5" text-anchor="end" stroke="none">10</text>
  </g>

</svg>
