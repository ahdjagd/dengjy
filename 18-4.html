<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECharts 图表演示 - 邓嘉毅 24001010907</title>
<meta name="author" content="邓嘉毅 24001010907">
<script src="./cdn/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { text-align: center; padding: 28px 20px 18px; border-bottom: 3px solid #fbbf24; background: linear-gradient(135deg, #1e293b, #0f172a); }
  header h1 { font-size: 26px; background: linear-gradient(90deg, #fbbf24, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { color: #94a3b8; font-size: 13px; margin-top: 6px; }
  .author { display: inline-block; margin-top: 10px; padding: 5px 16px; background: #fbbf24; color: #0f172a; border-radius: 20px; font-size: 12px; font-weight: bold; }
  .grid { max-width: 1100px; margin: 24px auto 40px; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 16px; color: #fbbf24; margin-bottom: 10px; }
  .chart { width: 100%; height: 380px; }
</style>
</head>
<body>

<header>
  <h1>📊 ECharts 图表演示</h1>
  <p>柱状图 + 饼图 · echarts 通过本地 cdn/echarts.min.js 引入</p>
  <span class="author">邓嘉毅 · 24001010907</span>
</header>

<div class="grid">
  <div class="panel">
    <h2>📈 柱状图：一周各品类销售额</h2>
    <div id="barChart" class="chart"></div>
  </div>
  <div class="panel">
    <h2>🥧 饼图：流量来源占比</h2>
    <div id="pieChart" class="chart"></div>
  </div>
</div>

<script>
  // 图 1：柱状图
  const bar = echarts.init(document.getElementById('barChart'), 'dark');
  bar.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis' },
    legend: { data: ['线上销售', '线下销售'], textStyle: { color: '#cbd5e1' } },
    xAxis: { type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日'] },
    yAxis: { type: 'value', name: '万元' },
    series: [
      { name: '线上销售', type: 'bar', data: [12, 20, 15, 8, 22, 30, 28], itemStyle: { color: '#22d3ee', borderRadius: [6,6,0,0] } },
      { name: '线下销售', type: 'bar', data: [8, 12, 10, 6, 14, 20, 18], itemStyle: { color: '#a78bfa', borderRadius: [6,6,0,0] } }
    ]
  });

  // 图 2：饼图
  const pie = echarts.init(document.getElementById('pieChart'), 'dark');
  pie.setOption({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    legend: { bottom: 0, textStyle: { color: '#cbd5e1' } },
    series: [{
      name: '流量来源', type: 'pie', radius: ['35%', '65%'], center: ['50%', '45%'],
      label: { color: '#e2e8f0' },
      data: [
        { value: 40, name: '搜索引擎' },
        { value: 25, name: '直接访问' },
        { value: 15, name: '社交媒体' },
        { value: 12, name: '邮件营销' },
        { value: 8,  name: '其他渠道' }
      ],
      itemStyle: { borderColor: '#0f172a', borderWidth: 2, borderRadius: 6 }
    }]
  });

  window.addEventListener('resize', () => { bar.resize(); pie.resize(); });
</script>

</body>
</html>
